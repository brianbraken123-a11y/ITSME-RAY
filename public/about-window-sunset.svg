<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Sunset Twilight Sky Gradient -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="30%" stop-color="#581c87" />
      <stop offset="55%" stop-color="#9a3412" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="90%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Cloud Glow -->
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c2410c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.4" />
    </linearGradient>

    <!-- City Skyline Fog -->
    <linearGradient id="cityMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Room Interior Deep Shadow -->
    <linearGradient id="roomShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="40%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Desk Wood Grain -->
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="20%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Sunset Rim Light on Silhouette -->
    <linearGradient id="rimLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Laptop Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Book Spines Gradients -->
    <linearGradient id="bookHistory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" /><stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="bookPsych" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" /><stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bookFinance" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" /><stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bookTech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" /><stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="bookStory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" /><stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= 1. THE WINDOW & OUTSIDE SUNSET SKY ================= -->
  <!-- Outside Window View -->
  <rect x="0" y="0" width="900" height="460" fill="url(#sunsetSky)" />

  <!-- Dramatic Cloud Banks -->
  <path d="M 0 120 Q 250 80 500 130 Q 750 170 900 110 L 900 240 L 0 240 Z" fill="url(#cloudGlow)" opacity="0.45" />
  <path d="M 0 180 Q 200 140 450 190 Q 700 220 900 170 L 900 300 L 0 300 Z" fill="#9a3412" opacity="0.3" />
  <path d="M 100 80 Q 300 50 600 90 Q 800 120 900 70 L 900 160 L 0 160 Z" fill="#4c1d95" opacity="0.4" />

  <!-- Golden Sun Glow on Horizon -->
  <circle cx="550" cy="360" r="140" fill="#fef08a" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="550" cy="360" r="70" fill="#fed7aa" opacity="0.4" />

  <!-- ================= 2. CITY SKYLINE & TEMPLE SILHOUETTES ================= -->
  <!-- Distant Angkor / Temple Stupas and High-Rise Silhouettes -->
  <!-- Angkor-inspired temple towers -->
  <path d="M 520 380 L 530 330 Q 535 310 540 280 Q 545 310 550 330 L 560 380 Z" fill="#451a03" />
  <path d="M 545 380 L 555 310 Q 565 290 575 260 Q 585 290 595 310 L 605 380 Z" fill="#291102" /> <!-- Central Tower -->
  <path d="M 590 380 L 600 330 Q 605 310 610 280 Q 615 310 620 380 Z" fill="#451a03" />
  <line x1="575" y1="250" x2="575" y2="265" stroke="#fed7aa" stroke-width="2" />

  <!-- City Skyline Skyscrapers -->
  <rect x="420" y="320" width="30" height="80" fill="#1c1917" />
  <rect x="460" y="300" width="40" height="100" fill="#18181b" />
  <rect x="480" y="270" width="6" height="30" fill="#27272a" /> <!-- Antenna -->
  <rect x="630" y="310" width="35" height="90" fill="#1c1917" />
  <rect x="675" y="335" width="45" height="75" fill="#27272a" />
  <rect x="730" y="350" width="50" height="60" fill="#18181b" />
  <rect x="360" y="340" width="45" height="70" fill="#292524" />
  <rect x="310" y="355" width="40" height="60" fill="#1c1917" />

  <!-- Golden Glowing Windows in Distance -->
  <g fill="#fef08a" opacity="0.75">
    <rect x="430" y="335" width="2" height="3" /><rect x="440" y="335" width="2" height="3" />
    <rect x="430" y="345" width="2" height="3" /><rect x="440" y="345" width="2" height="3" />
    <rect x="470" y="315" width="3" height="4" /><rect x="480" y="315" width="3" height="4" />
    <rect x="470" y="330" width="3" height="4" /><rect x="480" y="330" width="3" height="4" />
    <rect x="640" y="325" width="2" height="3" /><rect x="650" y="325" width="2" height="3" />
    <rect x="640" y="340" width="2" height="3" /><rect x="650" y="340" width="2" height="3" />
  </g>

  <!-- Horizon Mist -->
  <rect x="0" y="360" width="900" height="80" fill="url(#cityMist)" />

  <!-- ================= 3. WINDOW FRAMES & ARCHITECTURE ================= -->
  <!-- Left Wall & Frame -->
  <rect x="0" y="0" width="160" height="650" fill="#09090b" />
  <!-- Upper Transom Beam -->
  <rect x="150" y="0" width="750" height="50" fill="#18181b" />
  <!-- Center Vertical Window Mullion -->
  <rect x="380" y="40" width="22" height="420" fill="#1c1917" />
  <rect x="780" y="40" width="26" height="420" fill="#18181b" />
  <!-- Window Sill -->
  <rect x="150" y="440" width="750" height="24" fill="#292524" />
  <line x1="150" y1="440" x2="900" y2="440" stroke="#f97316" stroke-width="1.5" opacity="0.6" /> <!-- Sunset rim reflection on sill -->

  <!-- ================= 4. SLATE BLACKBOARD (Top Right) ================= -->
  <!-- Slate Board on Wall -->
  <rect x="800" y="90" width="90" height="210" rx="4" fill="#18181b" stroke="#27272a" stroke-width="2" />
  <!-- Chalk Logo / Heart -->
  <path d="M 835 125 Q 845 115 855 125 Q 865 115 875 125 Q 855 145 855 145 Z" fill="none" stroke="#e2e8f0" stroke-width="1.2" opacity="0.7" />
  <!-- Chalk Text: Better Ideas, Bigger Impact -->
  <text x="815" y="170" font-family="'Caveat', cursive, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff" opacity="0.75" transform="rotate(-3, 815, 170)">Better</text>
  <text x="818" y="190" font-family="'Caveat', cursive, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff" opacity="0.75" transform="rotate(-2, 818, 190)">Ideas</text>
  <text x="815" y="225" font-family="'Caveat', cursive, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff" opacity="0.8" transform="rotate(-2, 815, 225)">Bigger</text>
  <text x="818" y="245" font-family="'Caveat', cursive, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#ffffff" opacity="0.8" transform="rotate(-1, 818, 245)">Impact</text>

  <!-- ================= 5. CHALK WRITING ON WINDOW GLASS ================= -->
  <!-- Handwritten chalk formula: Cerita + Data + Aksi = Kebebasan -> -->
  <g font-family="'Caveat', 'Segoe Script', cursive, sans-serif" fill="#ffffff" opacity="0.85" filter="url(#softGlow)">
    <text x="450" y="90" font-size="18" font-weight="bold">Cerita</text>
    <text x="465" y="112" font-size="18" font-weight="bold">+</text>
    <text x="455" y="132" font-size="18" font-weight="bold">Data</text>
    <text x="465" y="152" font-size="18" font-weight="bold">+</text>
    <text x="458" y="172" font-size="18" font-weight="bold">Aksi</text>
    <text x="466" y="190" font-size="16" font-weight="bold">=</text>
    <text x="442" y="215" font-size="19" font-weight="bold">Kebebasan</text>
    <path d="M 525 210 L 545 208 M 540 203 L 547 208 L 540 215" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= 6. STUDY DESK & WORKSPACE ================= -->
  <!-- Solid Dark Wood Study Desk Surface -->
  <rect x="0" y="460" width="900" height="190" fill="url(#deskWood)" />
  <line x1="0" y1="460" x2="900" y2="460" stroke="#44403c" stroke-width="2" />
  <line x1="160" y1="461" x2="780" y2="461" stroke="#f97316" stroke-width="2" opacity="0.4" /> <!-- Sunset desk rim light -->

  <!-- BOOK STACK (History, Psychology, Finance, Technology, Storytelling) -->
  <g id="book-stack">
    <!-- Bottom Book: Storytelling -->
    <rect x="300" y="605" width="135" height="28" rx="3" fill="url(#bookStory)" stroke="#1e1b4b" stroke-width="1" />
    <text x="325" y="623" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1">Storytelling</text>
    <line x1="302" y1="608" x2="433" y2="608" stroke="#312e81" stroke-width="0.8" />

    <!-- Book 4: Technology -->
    <rect x="305" y="578" width="130" height="26" rx="3" fill="url(#bookTech)" stroke="#3f3f46" stroke-width="1" />
    <text x="328" y="595" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">Technology</text>

    <!-- Book 3: Finance -->
    <rect x="312" y="552" width="122" height="25" rx="3" fill="url(#bookFinance)" stroke="#475569" stroke-width="1" />
    <text x="340" y="568" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1">Finance</text>

    <!-- Book 2: Psychology -->
    <rect x="310" y="526" width="125" height="25" rx="3" fill="url(#bookPsych)" stroke="#334155" stroke-width="1" />
    <text x="330" y="542" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="1">Psychology</text>

    <!-- Top Book: History -->
    <rect x="316" y="500" width="118" height="25" rx="3" fill="url(#bookHistory)" stroke="#52525b" stroke-width="1" />
    <text x="344" y="516" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f4f4f5" letter-spacing="1">History</text>
  </g>

  <!-- LAPTOP WITH GLOWING CODE EDITOR -->
  <g id="laptop" filter="url(#softGlow)">
    <!-- Base / Keyboard area -->
    <polygon points="460,575 570,575 595,620 445,620" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <!-- Trackpad -->
    <rect x="500" y="605" width="35" height="12" rx="2" fill="#18181b" />
    <!-- Open Display Screen angled up -->
    <polygon points="460,575 465,465 570,465 570,575" fill="#09090b" stroke="#52525b" stroke-width="2" />
    <!-- Screen Inner Display with Code Lines -->
    <rect x="470" y="475" width="95" height="90" fill="url(#screenGlow)" rx="1" />
    <!-- Glowing Code Lines -->
    <g fill="#e0f2fe" opacity="0.8">
      <rect x="475" y="485" width="35" height="3" /><rect x="515" y="485" width="25" height="3" fill="#f472b6" />
      <rect x="480" y="493" width="55" height="3" fill="#a7f3d0" />
      <rect x="485" y="501" width="40" height="3" fill="#fde047" />
      <rect x="485" y="509" width="60" height="3" />
      <rect x="480" y="517" width="30" height="3" fill="#c084fc" />
      <rect x="475" y="525" width="45" height="3" fill="#38bdf8" />
      <rect x="480" y="533" width="50" height="3" />
      <rect x="475" y="541" width="20" height="3" fill="#f472b6" />
    </g>
  </g>

  <!-- STEAMING CERAMIC COFFEE MUG -->
  <g id="coffee-mug">
    <ellipse cx="585" cy="580" rx="14" ry="4" fill="#09090b" opacity="0.4" />
    <!-- Mug Body -->
    <path d="M 575 540 L 595 540 L 593 575 L 577 575 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <path d="M 595 548 Q 604 555 594 565" fill="none" stroke="#3f3f46" stroke-width="2" /> <!-- Handle -->
    <!-- Steam waves -->
    <path d="M 582 535 Q 580 525 584 515 Q 588 505 584 495" fill="none" stroke="#f1f5f9" stroke-width="1.2" opacity="0.4" />
    <path d="M 588 535 Q 592 525 588 515 Q 584 505 588 495" fill="none" stroke="#f1f5f9" stroke-width="1.2" opacity="0.3" />
  </g>

  <!-- DESK MANUSCRIPT PAPERS & FOUNTAIN PEN -->
  <g id="papers">
    <polygon points="490,620 590,600 620,645 520,650" fill="#f4f4f5" opacity="0.15" stroke="#71717a" stroke-width="1" />
    <polygon points="500,615 600,598 625,640 525,648" fill="#ffffff" opacity="0.2" stroke="#a1a1aa" stroke-width="1" />
    <line x1="560" y1="625" x2="610" y2="605" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" /> <!-- Pen -->
  </g>

  <!-- ================= 7. SILHOUETTE OF RAY AT DESK ================= -->
  <!-- Back View / Side Profile of Ray looking thoughtfully out the window at dusk -->
  <g id="ray-silhouette">
    <!-- Body / Back in Dark Hoodie/Jacket -->
    <path d="M 640 650 L 635 550 Q 640 450 690 410 Q 735 395 780 435 Q 820 490 815 650 Z" fill="#09090b" />

    <!-- Arm resting on desk holding chin/face thoughtfully -->
    <path d="M 655 530 Q 660 480 680 450 Q 700 420 705 400" fill="none" stroke="#18181b" stroke-width="28" stroke-linecap="round" />
    <!-- Hand to chin / cheek -->
    <circle cx="705" cy="400" r="14" fill="#a16207" opacity="0.6" />

    <!-- Left Arm resting along desk near papers -->
    <path d="M 640 560 Q 610 575 585 620" fill="none" stroke="#09090b" stroke-width="24" stroke-linecap="round" />

    <!-- Head & Neck -->
    <path d="M 700 410 Q 708 350 735 330 Q 770 335 778 395 Q 770 420 735 430 Z" fill="#18181b" />
    <!-- Curly Hair Silhouette with Sunset Rim Highlights -->
    <!-- Curly clusters on head -->
    <circle cx="725" cy="335" r="16" fill="#09090b" /><circle cx="740" cy="320" r="18" fill="#18181b" />
    <circle cx="760" cy="315" r="19" fill="#09090b" /><circle cx="778" cy="325" r="17" fill="#18181b" />
    <circle cx="788" cy="345" r="15" fill="#09090b" /><circle cx="785" cy="370" r="15" fill="#18181b" />
    <circle cx="775" cy="390" r="12" fill="#09090b" />

    <!-- Golden Sunset Rim Lighting on Hair and Shoulder -->
    <path d="M 720 345 Q 735 315 765 315 Q 795 325 792 370" fill="none" stroke="#fed7aa" stroke-width="3" opacity="0.85" filter="url(#softGlow)" />
    <path d="M 690 410 Q 705 400 730 405" fill="none" stroke="#fb923c" stroke-width="2.5" opacity="0.75" />
    <path d="M 680 435 Q 655 480 645 570" fill="none" stroke="#ea580c" stroke-width="2.5" opacity="0.6" /> <!-- Back contour rim light -->

    <!-- Chair Backrest -->
    <path d="M 740 580 L 840 570 L 830 650 L 735 650 Z" fill="#1c1917" stroke="#292524" stroke-width="2" />
  </g>

  <!-- ================= 8. "STILL IN PROGRESS..." HANDWRITTEN CHALK NOTE ================= -->
  <g font-family="'Caveat', cursive, sans-serif" fill="#e2e8f0" opacity="0.8" transform="rotate(-8, 830, 560)">
    <text x="800" y="560" font-size="20" font-weight="bold">Still</text>
    <text x="808" y="585" font-size="20" font-weight="bold">in progress...</text>
    <path d="M 835 605 Q 855 625 870 595 M 860 592 L 873 594 L 872 607" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
